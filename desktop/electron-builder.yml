appId: ai.nion.desktop
productName: Nion
electronVersion: 35.7.5
directories:
  output: release
files:
  - dist/**
  - renderer-dist/**
  - package.json
extraResources:
  - from: ../backend/dist/nion-backend
    to: backend
mac:
  target:
    - dmg
    - zip
win:
  target:
    - nsis
    - zip
publish:
  - provider: github
    owner: zhangtiancheng
    repo: nion
  - provider: generic
    url: ${NION_UPDATE_BASE_URL}
